            - heading "00 1. 项目定位与架构防守" [level=2] [ref=f14e84]
            - group [ref=f14e85]:
              - generic "Q1：用一分钟介绍项目，怎么避免报技术栈？ −" [ref=f14e86] [cursor=pointer]
              - generic [ref=f14e87]:
                - paragraph [ref=f14e88]:
                  - strong [ref=f14e89]: 短答：
                  - text: 我做的是可恢复客服Agent后端，解决复合诉求漏执行、长会话丢依据和业务操作中断后难以判断结果的问题。系统把请求编译成有依赖的任务，领域Agent在权限内取证，写操作经审批与对账，回答依据证据核验后持久交付。
                - paragraph [ref=f14e90]:
                  - strong [ref=f14e91]: 展开：
                  - text: 用“查配送、问拆封能否退、暂不提交”串起来：配送是实时工具事实，能否退需要政策条件，暂不提交约束执行。多Agent分别处理领域任务，ResultBoard保留缺失和部分成功。突出你的工程贡献是状态、证据和恢复边界的设计，不是把几个Prompt连起来。
                - paragraph [ref=f14e92]:
                  - strong [ref=f14e93]: 继续追问：
                  - text: 若问业务效果，分别报检索开发对照和业务验收，不拿内部verified代替真实完成率。入口：
                  - link "application/target_chat_application.py" [ref=f14e94] [cursor=pointer]:
                    - /url: https://github.com/Garrulus21yyx/DialogPilot/blob/ceeab4e1ab06414cdee1ce2a527095686743580b/application/target_chat_application.py
                  - text: 。
