            - paragraph [ref=e494]: ResponseAssembler 根据结果选择模板、适用的直通路径或 ConversationProvider.compose。Synthesizer 是组织回答的角色，不是重新执行任务的 Agent；Verifier 评估候选是否有据、是否回应需求、审批条款是否完整，Runtime 仍拥有审批和发布的决定权。
            - paragraph [ref=e495]:
              - text: 最新设计把同一份回答证据快照传给作者和核验器。
              - code [ref=e496]: requested_objective
              - text: 表示用户想达到什么，
              - code [ref=e497]: observed_segment
              - text: 表示当前 Worker 段实际返回什么，
              - code [ref=e498]: pending_actions
              - text: 只包含本轮选中、已准备的动作，业务回执另列。内部评审 accepted=true 不是业务成功事实，不再混入客户证据。核验器不额外拿一份重复 agent_outcomes 来重新解释同一事实。
            - paragraph [ref=e499]: 以“改账户地址，同时改待处理订单地址”为例：当前只准备了账户地址修改，就只能请求批准该项；订单修改可说明为剩余工作。完整诉求必须被回应，但不能因此把尚未准备的订单修改一起称为“已准备，确认后马上执行”。候选回答要兼顾需求覆盖和准确的审批范围。
