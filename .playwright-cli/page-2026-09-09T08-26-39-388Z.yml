            - paragraph [ref=e466]:
              - text: 会话状态存审批、活动目标和控制版本；最近消息和摘要帮助理解表达；业务事实带来源与版本；知识证据带 revision 和原文位置；执行历史帮助 Worker 继续工作。历史助手一句“可以退款”不是当前政策，用户说“已经到账”也不是支付系统回执。
              - code [ref=e467]: TargetTurnContext
              - text: 保留 role、source_ref、seq、watermark、projection_status；读取投影失败明确降级，不造“空历史代表无任务”的结论。
            - paragraph [ref=e468]: 预算按实际模型调用计入 system、工具 schema、任务输入、历史、输出预留和协议开销。工具结果先存 TargetResultArchive；接近预算时清理旧 ToolMessage，保留可回读引用；再触发语义摘要，保留目标、否定、未完成事项、已执行操作和不确定性。最新工具调用批次整体保护，避免 AI tool_call 与 ToolMessage 对不上。只有受保护后缀本身也装不下，才卸载其中大结果并让模型分页回读。
            - paragraph [ref=e469]: 回读原始快照是读取存储，不重新查订单。归档失败保留当前原始消息并停止该段，避免丢了唯一证据后继续回答。摘要也需要预算，失败不能悄悄用伪摘要替代。压缩日志保存 before/after token、原始引用、是否摘要和卸载调用，可从 Trace 查成本与信息损失。
            - paragraph [ref=e470]: 当前主 Agent 的模型输入还明确分为 native user/assistant 历史、当前用户原文、runtime_context 与配置合同。历史帮助理解指代，运行状态提供待处理工作，二者不能伪装成当前用户批准。领域 Worker 使用 delegated_task 限定自己的任务，source_context 只是相关背景。
