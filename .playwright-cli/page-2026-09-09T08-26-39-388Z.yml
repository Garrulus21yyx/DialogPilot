            - heading "06 6. 多 Agent 具体怎么协作" [level=2] [ref=e437]
            - paragraph [ref=e438]:
              - text: 这里是“主规划＋领域 Worker＋依赖调度”，不是多个角色自由辩论。每个 Worker 的
              - code [ref=e439]: AgentContextView
              - text: 包含自己的 WorkItem、用户当前请求、可用事实、相关历史、声明的依赖结果、预算和可信身份。工具集合按领域 principal 与任务 allowed_tools 求交，另可暴露允许的 Skill、动作提案和归档读取。
            - paragraph [ref=e440]: 调度器只派发依赖就绪任务，独立只读任务可以同一波运行。当前一个会话只有一个待审批槽位，因此同波最多放行一个可提案/可写任务，避免互相覆盖审批。某节点失败，依赖它的任务 BLOCKED；其他独立任务的成功留在 ResultBoard。跨任务事实需要 requirement 匹配，不能把产品信息冒充退款状态。
            - paragraph [ref=e441]:
              - text: 相关业务修改应作为完整目标委派。例如修改账户地址和待处理订单地址，需要领域 Worker 检查两种操作是否相互影响；不要让主 Agent 先拆成两个假定独立的写任务。领域使用
              - code [ref=e442]: operation_plan
              - text: 表达剩余目标和依赖，但无环只证明顺序关系，没有证明前置条件、状态效果和最终目标可同时满足。每段最多准备一个动作，获得回执后再评估剩余目标。
