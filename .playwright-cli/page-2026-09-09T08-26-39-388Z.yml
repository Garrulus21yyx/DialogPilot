              - text: 、
              - code [ref=e502]: continues_after_reply=false
              - text: ，并说明是否等待补充输入或审批。这个节点接下来提交状态并结束当前轮，所以不能把“目标未完成”写成“我正在后台继续”。未来可恢复不等于现在已有后台任务。已展示审批作为 retained_approval 保留，新的旁支问题不应自动再次索取批准。
            - paragraph [ref=e503]: 核验结果绑定具体问题、正文和证据指纹；修改候选或证据后要重新核验。失败可在同一事实快照上修订一次，不重新执行业务工具。普通补充问题有自己的完整性路径；正常事实回答、审批展示、服务提示不能统称为同一种发布合同。
            - paragraph [ref=e504]: 这些边界已经进入实现，但模型质量仍未闭环：最新 task22 在成功准备一个账户修改提案后，审批答复被拒绝，后续核验又出现结构化输出不符合 schema；最终未发生写入。既要评估误放行，也要评估误拒绝和流程阻塞，不能把“有 Verifier”说成“批准展示已可靠”。
