          - generic [ref=e510]:
            - heading "11 11. 写操作、审批与恢复" [level=2] [ref=e511]
            - paragraph [ref=e512]:
              - code [ref=e513]: TargetActionPreparation
              - text: 校验提案是否在任务允许范围，必要时调用只读准备工具获得业务 readiness 和目标版本，再生成 operation_key 与审批绑定。审批针对准备好的动作与参数，用户改变金额、商品或目标版本后不能沿用之前许可。
            - paragraph [ref=e514]:
              - code [ref=e515]: GovernedWriteRuntime
              - text: acquire 操作记录，已 COMMITTED 返回回执；EXECUTING、OUTCOME_UNKNOWN、RECONCILING 先进入对账；待批准则暂停。执行异常不能证明未提交，因此转 OUTCOME_UNKNOWN。业务工具明确报告 NOT_COMMITTED 才有安全重试依据。PostgreSQL ledger 的 CAS 阻止两个执行者同时取得同一状态转移的权利。恢复策略的次数、时间退避和人工复核边界应按固定源码核对，不据此推导恢复率成绩。
            - paragraph [ref=e516]:
              - text: 准备工具的 operation_plan 字段也采用任务作用域内实际可调用的准备工具枚举，模型看到的名称与验证器接收的名称一致。例如执行接口
              - code [ref=e517]: modify_pending_order_address
              - text: 与准备接口
              - code [ref=e518]: prepare_modify_pending_order_address
              - text: 不能混填；修复调用协议应保留剩余目标，不能通过删掉用户目标让错误消失。
            - paragraph [ref=e519]: 职责收缩修改了默认 Registry 的规划快捷项，因此 fingerprint 会变化。旧版本挂起任务仍受版本不匹配检查约束；不能静默替换其审批身份。部署时需要排空或明确迁移等待中的工作，这次网页发布不执行这类迁移。
            - paragraph [ref=e520]: Checkpoint 存图的运行位置，OperationLedger 存业务操作状态，业务系统/沙箱回执证明实际提交；三者不能互换。Publication 存正式答复，response_seq 支持客户端断线续取，ACK 的 delivered/read 单调推进。HTTP 连接断开不能回滚已经提交的退款，也不能靠重新生成一段话代替响应重放。
