            - group [ref=f1e267]:
              - generic "Q79：部署、性能和容量你能承诺什么？ −" [ref=f1e291] [cursor=pointer]
              - generic [ref=f1e292]:
                - paragraph [ref=f1e293]:
                  - strong [ref=f1e294]: 短答：
                  - text: 当前是Docker Compose本地可复现后端，有应用、PG、Redis、Nginx和监控；没有证据就不承诺高并发生产SLA。
                - paragraph [ref=f1e295]:
                  - strong [ref=f1e296]: 展开：
                  - text: CPU同步SQL、embedding/GPU、模型API和连接池都是潜在瓶颈。async接口不自动让阻塞操作无成本；并行检索也要受连接与线程预算限制。扩库遇过HNSW构建共享内存不足和一次PG不可用，前者有环境处理记录，后者底层原因未确定，不能说全是模型错误。压测应固定语料、缓存热度、并发和模型模式，报告队列/池等待与真实墙钟延迟。
                - paragraph [ref=f1e297]:
                  - strong [ref=f1e298]: 继续追问：
                  - text: 可先读only回放定位本地耗时，再做明确预算的真实API抽样；本轮文档没运行压测。源码：
