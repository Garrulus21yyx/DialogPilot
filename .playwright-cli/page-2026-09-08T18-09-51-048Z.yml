            - text: + + +
            - group [ref=f1e167]:
              - generic "Q34：HNSW为什么快，牺牲了什么？ −" [ref=f1e281] [cursor=pointer]
              - generic [ref=f1e282]:
                - paragraph [ref=f1e283]:
                  - strong [ref=f1e284]: 短答：
                  - text: 通过多层近邻图逐步接近目标，减少逐个向量计算，换来额外内存、建图成本和近似召回误差。
                - paragraph [ref=f1e285]:
                  - strong [ref=f1e286]: 展开：
                  - text: 上层稀疏导航，底层细搜。M是连接规模，ef_construction是建图候选宽度，ef_search是查询探索宽度；不要把三者都叫TopK。当前建图M16、ef_construction64，按generation创建cosine索引，查询是否走它需EXPLAIN验证。
                - paragraph [ref=f1e287]:
                  - strong [ref=f1e288]: 继续追问：
                  - text: exact topK仍可能语义错误；ANN recall和证据Recall不同。过滤可能减少有效候选，应测试不同scope选择性。
                  - link "官方说明" [ref=f1e289] [cursor=pointer]:
                    - /url: https://github.com/pgvector/pgvector
                  - text: 。源码：
                  - link "infrastructure/hybrid_retrieval_backend.py" [ref=f1e290] [cursor=pointer]:
                    - /url: https://github.com/Garrulus21yyx/DialogPilot/blob/ceeab4e1ab06414cdee1ce2a527095686743580b/infrastructure/hybrid_retrieval_backend.py
                  - text: 。
            - text: + + + + + + + + + +
