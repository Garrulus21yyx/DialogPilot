            - heading "07 7. LangChain 与 LangGraph 各用到哪里" [level=2] [ref=f2e392]
            - paragraph [ref=f2e393]:
              - text: LangChain 复用模型适配、StructuredTool、消息结构、create_agent 和 middleware。LangGraph 复用 StateGraph、条件边、Send、interrupt/resume、checkpointer 和流式状态。项目自研的是上述组件周围的业务合同、权限、状态、证据和发布规则。
              - code [ref=f2e394]: create_agent
              - text: 本身基于 LangGraph，因此两者不是并列的两个竞争引擎。
            - paragraph [ref=f2e395]:
              - text: Worker middleware 处理工作版本检查、工具结果归档、交互边界、进展检查、上下文压缩、输入预算、模型/工具步数限制与异常转换。执行使用
              - code [ref=f2e396]: astream(stream_mode='values')
              - text: 保存最后完成的状态，以便后续模型失败时仍知道已有工具结果。超时、步数耗尽、模型故障、结果归档不可用分别转换为类型化失败。
            - paragraph [ref=f2e397]:
              - text: 框架提供恢复设施但不会自动证明退款只执行一次。
              - code [ref=f2e398]: interrupt
              - text: 恢复涉及节点重入，所以副作用必须在项目写操作边界用幂等标识和回执保护。也不能把
              - code [ref=f2e399]: recursion_limit
