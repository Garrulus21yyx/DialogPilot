            - paragraph [ref=f2e366]: 意图分类回答“这轮主要属于什么领域”；动作选择回答“当前需要调用哪些能力”；任务编译回答“哪些动作合法、依赖怎样满足”。这三个问题的输入和风险不同。用户说“退款”，可能在问政策、查到账、申请退款或者取消申请，分类成 billing_refund 仍不能决定执行哪一个工具。
            - paragraph [ref=f2e367]:
              - text: 当前
              - code [ref=f2e368]: TargetDomainEncoder
              - text: 使用标准 Transformers 序列分类器，输入序列化的最近对话、当前目标和当前用户消息；输出六领域及 DEFER。领域有 general、product_technical、order_logistics、billing_refund、account_security、human_service。在线只加载 ACTIVE 且通过 manifest 校验的产物。接受时生成 DELEGATE_TASK，仍经相同 Policy；不会生成业务成功回执。
