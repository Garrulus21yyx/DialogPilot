          - generic [ref=f2e467]:
            - heading "13 13. 评测怎样形成优化闭环" [level=2] [ref=f2e468]
            - paragraph [ref=f2e469]: 首先选问题：候选没召回、Top5 丢必要证据、Agent 没发检索、改写丢否定、生成漏条件，还是工具提交状态误判。然后冻结数据、split、代码/模型/索引身份和预算，只改变待验证变量；保存原始失败，逐题统计救回和误伤。采用标准在实验前确定，开发结果好才进入未见验收，不能反复看 heldout 再称盲测。
            - paragraph [ref=f2e470]: 外部 RAG 数据分别承担文档依据、多轮查询和产品支持问答的能力检查；中文电商模拟集用于政策条件和跨来源必要证据；混合订单取证需真实 Agent 与业务 fixture；τ³ 用环境工具和原生评估检验交互任务。纯检索、完整问答、业务完成是三个分母。
            - paragraph [ref=f2e471]: 当前报告提供了反例驱动的真实闭环：扩大候选池曾让最终 pack 更差，因此不采用；均衡融合在三个已消费集方向一致，采用为实用默认；复杂中文小库完整证据率 62.5%→77.5%，但全库只有17 chunks，不能证明大库召回。最新扩库6287文档结果完整覆盖仅30%→32.5%，双臂均OK的39题没有净增，下一步应验证结构化适用范围，而不是宣称改写已改善大库质量。Encoder 未通过独立复核保持关闭。正负结果同时保留，才叫可解释的选型。
            - paragraph [ref=f2e472]:
              - text: 完整数字和边界在
              - link "RAG 专题" [ref=f2e473] [cursor=pointer]:
                - /url: /DialogPilot/rag-study.html
              - text: 与
              - link "来源记录" [ref=f2e474] [cursor=pointer]:
