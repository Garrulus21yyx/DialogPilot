          - generic [ref=f2e442]:
            - heading "11 11. 写操作、审批与恢复" [level=2] [ref=f2e443]
            - paragraph [ref=f2e444]:
              - code [ref=f2e445]: TargetActionPreparation
              - text: 校验提案是否在任务允许范围，必要时调用只读准备工具获得业务 readiness 和目标版本，再生成 operation_key 与审批绑定。审批针对准备好的动作与参数，用户改变金额、商品或目标版本后不能沿用之前许可。
            - paragraph [ref=f2e446]:
              - code [ref=f2e447]: GovernedWriteRuntime
              - text: acquire 操作记录，已 COMMITTED 返回回执；EXECUTING、OUTCOME_UNKNOWN、RECONCILING 先进入对账；待批准则暂停。执行异常不能证明未提交，因此转 OUTCOME_UNKNOWN。业务工具明确报告 NOT_COMMITTED 才有安全重试依据。PostgreSQL ledger 的 CAS 阻止两个执行者同时取得同一状态转移的权利。快照工作区还接入恢复policy的对账次数、时间退避及manual review边界；它属于未提交实现检查，不据此新增恢复率成绩。
            - paragraph [ref=f2e448]: Checkpoint 存图的运行位置，OperationLedger 存业务操作状态，业务系统/沙箱回执证明实际提交；三者不能互换。Publication 存正式答复，response_seq 支持客户端断线续取，ACK 的 delivered/read 单调推进。HTTP 连接断开不能回滚已经提交的退款，也不能靠重新生成一段话代替响应重放。
            - paragraph [ref=f2e449]:
