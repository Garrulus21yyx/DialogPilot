          - generic [ref=f2e431]:
            - heading "10 10. Synthesizer、Verifier 和发布各管什么" [level=2] [ref=f2e432]
            - paragraph [ref=f2e433]: Synthesizer 在项目中主要对应 ResponseAssembler 调用 ConversationProvider.compose：把多个任务结果变成用户能读懂的答案，既表达成功，也说明缺失、失败或等待审批。它没有再次执行写操作的权力。简单类型化结果可直接渲染，复杂答复才需要 compose，不能把整条链想成固定调用 N 次 LLM。
            - paragraph [ref=f2e434]: ResultBoard 的结构性覆盖先检查任务与证据是否就绪；语义 Verifier 再判断候选是否 supported、answered、审批条款是否完整，并返回 issues。结果绑定 question、answer、context、task/coverage/outcomes/evidence 的指纹，防止把旧 PASS 用在新回答上。只有明确受支持的结果才获得正常回答的发布资格。
            - paragraph [ref=f2e435]: 核验不通过可根据反馈从同一个 board 修订一次，随后再核验，不重跑业务工具。发布前还校验引用 ID 和 source revision。Unknown 是不能判断，不等于已证明答案错；系统可以发布类型化服务提示或请求输入，所以“只有 PASS 的任何文字才会出现在屏幕”也不准确，应说“正常事实性候选答复受核验约束”。
            - paragraph [ref=f2e436]: Verifier 仍是模型，会共同遗漏条件。开发报告已出现自动 PASS 但人工审计有问题的情况，因此在线核验是防线，离线独立评分才衡量防线是否有效；绝不能以内部 PASS 率自证正确率。
