        - article [ref=f2e83]:
          - generic [ref=f2e84]:
            - heading "00 快速导航" [level=2] [ref=f2e85]
            - paragraph [ref=f2e86]:
              - text: 先读本页把调用链串起来，再用
              - link "详细面试追问" [ref=f2e87] [cursor=pointer]:
                - /url: /DialogPilot/interview-guide.html
              - text: 练原理、取舍与反问，最后用
              - link "项目讲述与简历" [ref=f2e88] [cursor=pointer]:
                - /url: /DialogPilot/project-pitch.html
              - text: 组织开场。RAG 专题见
              - link "离线在线与评测手册" [ref=f2e89] [cursor=pointer]:
                - /url: /DialogPilot/rag-study.html
              - text: ，外部依据见
              - link "来源与证据" [ref=f2e90] [cursor=pointer]:
                - /url: /DialogPilot/handbook-evidence.html
              - text: 。
            - paragraph [ref=f2e91]: 本文有意区分三层：模型负责判断要做什么；应用合同决定什么可以执行；持久业务记录决定实际上发生了什么。会说“退款完成”的模型、已跑完的图、数据库中的退款回执是三个不同事实。
          - generic [ref=f2e92]:
            - heading "01 1. 用一件客服任务解释整个系统" [level=2] [ref=f2e93]
            - paragraph [ref=f2e94]: 用户说：“查一下订单配送，如果已经签收，看看这个产品拆封后还能不能退，先别提交退款。”系统需要识别三个信息：订单是谁、配送是否完成、退货政策适用什么条件；同时保留“先别提交”的限制。
            - paragraph [ref=f2e95]: 入口先从 JWT 得到可信用户，保存请求身份，才开始模型工作。ConversationAgent 可以选择直接订单查询，也可以把政策咨询交给领域 Worker；明确依赖时，政策任务等订单事实到达再执行，独立的产品说明可以并行。每个任务带自己的 Owner、允许工具、依赖和预算。Worker 获得订单回执和知识证据后返回类型化结果。ResultBoard 判断各项是否完成、缺什么；ResponseAssembler 把结果组织成自然语言，Verifier 检查结论是否受证据支持、是否回答了需求。最终回答持久化后交付。
            - paragraph [ref=f2e96]: 即使发现可退，也不能把“可以退”变成“已经退”。模型若提出退款，只能生成待审批动作；用户批准后还要核对操作绑定和目标版本。若请求中断，恢复图位置不等于重做退款，已提交回执可以重放，结果未知先对账。这就是项目的主线：理解、执行和交付都保留可以核查的状态。
