  - heading "核心亮点" [level=2] [ref=e32]
  - paragraph [ref=e33]:
    - strong [ref=e34]: 多 Agent 协作，有明确的任务边界。
    - text: 会话状态优先续接，ConversationAgent 生成计划，LangGraph 按依赖调度领域 Worker；独立只读任务并行，补充输入与审批沿原任务继续。
  - paragraph [ref=e35]:
    - strong [ref=e36]: 上下文可以压缩，原始证据可以回查。
    - text: 联合计算提示、工具与历史预算，归档工具原文，清理旧观察并压缩历史；需要细节时分页回读，减少重复业务调用。
  - paragraph [ref=e37]:
    - strong [ref=e38]: 政策与订单分别取证，回答保留来源。
    - text: pgvector 与中文 BM25 混合召回，经过查询改写、RRF、精排与预算装配；知识证据保留版本和原文位置，实时业务事实保留工具回执。
  - paragraph [ref=e39]:
    - strong [ref=e40]: 恢复执行时，先辨认副作用状态。
    - text: 动作准备绑定参数和审批，PostgreSQL checkpoint 保存执行位置，操作账本记录执行状态。已提交动作复用回执，未知结果进入对账。
  - paragraph [ref=e41]:
    - strong [ref=e42]: 合成与核验按需介入。
    - text: ResultBoard 汇总事实，ResponseAssembler 选择模板、直通或合成；需要核验的回答绑定正文与证据，避免额外模型调用成为每轮必经步骤。
  - paragraph [ref=e43]:
    - strong [ref=e44]: 优化有证据，也保留失败。
    - text: 通过 Trace 定位查询、召回、精排、打包、生成与执行问题，固定预算比较救回与误伤。公开检索数据和中文业务模拟集分别报告。
