  - paragraph [ref=e220]: 不同数据集的文章、片段与 span 标注不混算。模型核验通过、合法引用、完整证据和最终答案正确是不同指标。模拟数据、已消费的开发/回归样本、独立留存和真实业务流量也分别标明。
  - paragraph [ref=e221]:
    - text: 现有工作包括融合权重对照、Metadata 适用范围贯通、Markdown 标题切块实验，以及 BM25 访问路径与性能诊断。
    - strong [ref=e222]: 局部指标改善不代表整体质量验收完成
    - text: ；当前仍有多证据排序、查询语义、答案覆盖和词法检索性能缺口，reranker 微调保持暂停。
