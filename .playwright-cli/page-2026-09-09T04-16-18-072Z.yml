  - paragraph [ref=e63]:
    - strong [ref=e64]: 3. 运行真实鉴权示例
  - paragraph [ref=e65]: 在主机建立 Python 3.12 环境，安装示例所需的运行依赖：
  - code [ref=e67]: python3.12 -m venv .venv source .venv/bin/activate pip install -r requirements.txt PYTHONPATH=. python scripts/run_local_e2e.py \ --output evaluation/reports/local-e2e-v1.json
  - paragraph [ref=e68]: 脚本读取本地配置，执行鉴权、附件上传和客服对话，输出脱敏报告；此步骤会调用配置的模型服务。
  - heading "整体架构" [level=2] [ref=e69]
  - code [ref=e71]: flowchart TB Client[客户端 / 多轮消息 / 附件] --> API[FastAPI · JWT 身份与输入边界] API --> Admission[持久准入 · request_id / Invocation] Admission --> Conversation[会话状态续接与 ConversationAgent 规划] Conversation --> Plan[WorkPlan · 依赖与工具权限] subgraph Runtime[LangGraph 任务编排] Plan --> Dispatch[调度就绪任务] Dispatch --> Workers[领域 Worker · LangChain create_agent] Workers --> Read[只读业务工具 / Knowledge RAG] Workers --> Action[动作准备 / 用户审批 / 受控写入] Workers --> Media[按需媒体感知 · L0 / OCR / VLM] Read --> Board[ResultBoard · 结果 / 证据 / 进展] Action --> Board Media --> Board end Board --> Assembly[ResponseAssembler · 模板 / 直通 / 按需合成] Assembly --> Gate[对应响应路径的完整性与证据检查] Gate --> Publication[Publication · 持久回答与 response_seq] Publication --> Delivery[客户端接收 / ACK / 断线重放] Board --> Followup[补充输入 / 审批 / 后续任务] Followup --> Conversation PG[(PostgreSQL · 权威事实与持久执行状态)] -.-> Admission PG -.-> Runtime PG -.-> Publication Publication --> Redis[(Redis · 可重建会话投影)] Runtime -.-> Trace[脱敏 Trace / Prometheus / 可选 Langfuse]
  - heading "1. 分层决策与多 Agent 协作" [level=3] [ref=e72]
  - list [ref=e73]:
    - listitem [ref=e74]:
      - strong [ref=e75]: 会话层决定做什么：
      - text: 先处理已有任务、待补信息和审批状态，再由 ConversationAgent 形成结构化提案，经策略与编译边界转为 WorkPlan。
    - listitem [ref=e76]:
      - strong [ref=e77]: 编排层决定何时做：
      - text: LangGraph 根据依赖派发任务。独立只读任务可并行；当前单会话审批槽约束下，具备动作能力的 Worker 串行调度。
    - listitem [ref=e78]:
      - strong [ref=e79]: 领域层决定如何取证：
      - text: 六个领域共用
      - code [ref=e80]: create_agent
      - text: 工具循环，按任务授权暴露工具；Skill 提供可选复合能力。任务结果进入 ResultBoard，保留成功、部分完成、等待与失败等结构化状态。
    - listitem [ref=e81]:
      - strong [ref=e82]: 回答层决定如何表达：
      - text: 简单结果使用模板或适用的直通路径；复杂结果按需调用合成器。核验检查证据支持与需求覆盖，发布结果绑定具体正文。普通补充问题有独立完整性路径，不需要每轮都增加一次模型评审。
  - paragraph [ref=e83]:
    - text: 可选 Encoder 路由通过显式开关与模型制品状态管理，示例配置默认关闭。核心入口见
    - link [ref=e84] [cursor=pointer]:
      - /url: application/turn_runtime.py
      - code [ref=e85]: turn_runtime.py
    - text: 、
    - link [ref=e86] [cursor=pointer]:
      - /url: application/orchestration_runtime.py
      - code [ref=e87]: orchestration_runtime.py
    - text: 和
    - link [ref=e88] [cursor=pointer]:
      - /url: application/response_assembly.py
      - code [ref=e89]: response_assembly.py
    - text: 。
  - heading "2. 上下文预算与可追溯证据" [level=3] [ref=e90]
  - paragraph [ref=e91]: 上下文管理覆盖一次实际模型请求中的系统提示、工具 Schema、历史消息与输出预留。长工具结果保存原文，模型使用摘要或引用按需分页回读；旧工具观察与历史消息逐步清理、压缩，并保留当前目标及必要工具交互。
  - paragraph [ref=e92]:
    - text: 归档内容带作用域与校验信息。业务回执、知识来源和媒体观察保留各自身份；OCR/VLM 的识别内容作为观察使用，不能独立证明订单状态或执行成功。实现见
    - link "预算管理" [ref=e93] [cursor=pointer]:
      - /url: application/context_budget.py
    - text: 、
    - link "上下文压缩" [ref=e94] [cursor=pointer]:
      - /url: infrastructure/target_context_compaction.py
    - text: 和
    - link "结果归档" [ref=e95] [cursor=pointer]:
      - /url: infrastructure/target_result_archive.py
    - text: 。
