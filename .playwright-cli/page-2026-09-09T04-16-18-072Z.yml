    - text: 恢复需要同时回答两个问题：checkpoint 决定
    - strong [ref=e133]: 执行从哪里继续
    - text: ，操作账本与回执决定
    - strong [ref=e134]: 业务动作是否已经发生
    - text: 。已提交操作复用回执；结果未知的操作需要对账，不能把异常直接解释为“没有执行”。回答同样区分持久发布、客户端送达与已读，通过序号与 ACK 续接。
  - heading "Knowledge RAG：从资料到可引用证据" [level=2] [ref=e135]
  - code [ref=e137]: flowchart LR subgraph Offline[离线知识构建] Source[原文与适用信息] --> Revision[SourceRevision · 版本与位置] Revision --> Chunk[结构感知切块] Chunk --> Index[词法索引 + pgvector 向量索引] end subgraph Online[在线检索与打包] Context[会话上下文 / 完整问题] --> Query[按查询模式改写与保留原问题] Query --> Scope[身份与知识适用范围] Scope --> Recall[Dense + 中文 BM25] Index --> Recall Recall --> Fusion[Weighted RRF · 去重与候选截取] Fusion --> Rerank[可配置精排] Rerank --> Pack[预算装配 · Evidence Pack] end Pack --> Answer[领域回答 / 结果合成 / 对应核验]
  - paragraph [ref=e138]:
    - strong [ref=e139]: 设计重点
  - list [ref=e140]:
    - listitem [ref=e141]:
      - strong [ref=e142]: 完整问题进入检索：
      - text: 区分需要结合历史改写的查询和已经解析完整的查询；原始问题与独立问题按配置融合，避免只拿多轮追问中的短句检索。
    - listitem [ref=e143]:
      - strong [ref=e144]: 适用范围先于相关性：
      - text: 由系统绑定身份与适用信息。知识来源保留版本、时间和范围，避免把不同商品或渠道的相似条款混为有效证据。
    - listitem [ref=e145]:
      - strong [ref=e146]: 候选排序与证据打包分别评估：
      - text: 高相关片段不一定覆盖所有必要条件；同时检查候选池、精排 Top-K 和模型实际可见正文。
    - listitem [ref=e147]:
      - strong [ref=e148]: 来源可回查：
      - text: Evidence Pack 保留 source revision、checksum、原文范围与检索信息，支持引用核对和失败重放。实时订单、退款或账户状态仍由业务工具提供。
