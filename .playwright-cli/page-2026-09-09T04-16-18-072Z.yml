  - separator [ref=e20]
  - paragraph [ref=e21]:
    - text: DialogPilot 是面向电商售后与客户支持的 Python 后端，处理跨领域查询、多轮追问、知识与订单混合取证，以及需要用户确认的业务操作。项目以
    - strong [ref=e22]: LangGraph 编排任务、LangChain 执行领域 Agent、PostgreSQL 保存权威事实
    - text: ，串联理解、执行、证据、发布与送达。
  - paragraph [ref=e23]: 例如，用户提出“查一下这笔订单是否符合退款政策，符合的话帮我申请”，系统需要同时获得订单事实和适用条款，补齐必要信息，展示待确认动作，并在授权后执行、记录回执；断线或恢复时，还需要识别哪些步骤已经完成。
  - paragraph [ref=e24]:
    - text: 可查看
    - link "真实鉴权示例及历史运行报告" [ref=e25] [cursor=pointer]:
      - /url: evaluation/reports/local-e2e-v1.json
    - text: ，或阅读
    - link "三套公开数据检索对照" [ref=e26] [cursor=pointer]:
      - /url: docs/rag-retrieval-selection-three-2026-09-08.zh-CN.md
    - text: 。上图是源码机制示意；报告的结论限定于各自运行版本与数据范围。
