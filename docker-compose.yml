# DialogPilot 智能客服系统 — 本地作品集服务编排
# PostgreSQL 权威事实 + Redis 当前会话投影

services:

  # ── PostgreSQL（新增 Conversation/Invocation/Outbox 的事实 Owner）────────────
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-bookworm
    container_name: dialogpilot-postgres
    ports:
      - "${DIALOGPILOT_POSTGRES_PORT:-15432}:5432"
    environment:
      POSTGRES_DB: dialogpilot
      POSTGRES_USER: dialogpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dialogpilot-local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - dialogpilot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dialogpilot -d dialogpilot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Redis 缓存（工作记忆）────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: dialogpilot-redis
    # Redis 只供 Compose 内部服务访问，避免与宿主/其他项目的 6379 冲突。
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-dialogpilot-local}
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - dialogpilot-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dialogpilot-local}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Prometheus 监控 ─────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: dialogpilot-prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks:
      - dialogpilot-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── DialogPilot 主应用 ─────────────────────────────────────────────────────────
  dialogpilot:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-local}
    container_name: dialogpilot-app
    ports:
      - "${DIALOGPILOT_API_PORT:-18000}:8000"
    env_file:
      - .env
    environment:
      # 容器内固定值，覆盖 .env 中的本地路径
      - REDIS_URL=redis://:${REDIS_PASSWORD:-dialogpilot-local}@redis:6379/0
      - DATABASE_URL=postgresql://dialogpilot:${POSTGRES_PASSWORD:-dialogpilot-local}@postgres:5432/dialogpilot
      - RETRIEVAL_DATABASE_URL=postgresql://dialogpilot:${POSTGRES_PASSWORD:-dialogpilot-local}@postgres:5432/dialogpilot
      - RAG_CHUNK_MAX_TOKENS=${RAG_CHUNK_MAX_TOKENS:-512}
      - RAG_CHUNK_OVERLAP_TOKENS=${RAG_CHUNK_OVERLAP_TOKENS:-64}
      - RAG_CHUNK_STRATEGY=${RAG_CHUNK_STRATEGY:-fixed_tokens}
      - RAG_RRF_K=${RAG_RRF_K:-10}
      - RAG_VECTOR_WEIGHT=${RAG_VECTOR_WEIGHT:-0.25}
      - RAG_LEXICAL_WEIGHT=${RAG_LEXICAL_WEIGHT:-0.75}
      - RAG_TOP_K=${RAG_TOP_K:-5}
      - RAG_CANDIDATE_K=${RAG_CANDIDATE_K:-20}
      - RAG_CONTEXT_MAX_TOKENS=${RAG_CONTEXT_MAX_TOKENS:-2600}
      - RAG_RAW_QUERY_WEIGHT=${RAG_RAW_QUERY_WEIGHT:-0.25}
      - RAG_STANDALONE_QUERY_WEIGHT=${RAG_STANDALONE_QUERY_WEIGHT:-0.75}
      - INTENT_SIMILARITY_MODE=${INTENT_SIMILARITY_MODE:-ngram}
      - INTENT_CACHE_TTL_SECONDS=${INTENT_CACHE_TTL_SECONDS:-3600}
      - DIALOGPILOT_SKILLS_DIR=/app/skills
      - TICKET_DB_PATH=/app/data/tickets/tickets.db
      - TICKET_DISPATCH_WEBHOOK_URL=${TICKET_DISPATCH_WEBHOOK_URL:-}
      - TICKET_DISPATCH_TIMEOUT_SECONDS=${TICKET_DISPATCH_TIMEOUT_SECONDS:-5}
      - TICKET_DISPATCH_POLL_SECONDS=${TICKET_DISPATCH_POLL_SECONDS:-5}
      - TICKET_DISPATCH_LEASE_SECONDS=${TICKET_DISPATCH_LEASE_SECONDS:-30}
      - TICKET_DISPATCH_RETRY_BASE_SECONDS=${TICKET_DISPATCH_RETRY_BASE_SECONDS:-5}
      - TICKET_DISPATCH_RETRY_MAX_SECONDS=${TICKET_DISPATCH_RETRY_MAX_SECONDS:-300}
      - BADCASE_DB_PATH=/app/data/badcases/badcases.db
      - BADCASE_IDENTITY_SALT=${BADCASE_IDENTITY_SALT:-}
      - CUSTOMER_OPERATIONS_DB_PATH=/app/data/customer-operations/operations.db
      - CONTEXT_INPUT_BUDGET=${CONTEXT_INPUT_BUDGET:-12000}
      - CONTEXT_OUTPUT_RESERVE=${CONTEXT_OUTPUT_RESERVE:-1536}
      - MEMORY_TOKEN_BUDGET=${MEMORY_TOKEN_BUDGET:-6000}
      - MEMORY_COMPRESSION_THRESHOLD=${MEMORY_COMPRESSION_THRESHOLD:-0.70}
      - MEMORY_SUMMARY_MAX_TOKENS=${MEMORY_SUMMARY_MAX_TOKENS:-1200}
      - MEMORY_FACT_IDLE_SECONDS=${MEMORY_FACT_IDLE_SECONDS:-300}
      - MEMORY_FACT_BATCH_TURNS=${MEMORY_FACT_BATCH_TURNS:-3}
      - MEMORY_FACT_WORKER_POLL_SECONDS=${MEMORY_FACT_WORKER_POLL_SECONDS:-5}
      - AGENT_TIMEOUT_SECONDS=${AGENT_TIMEOUT_SECONDS:-15}
      - AGENT_REQUEST_TIMEOUT_SECONDS=${AGENT_REQUEST_TIMEOUT_SECONDS:-20}
      - AGENT_MAX_PER_REQUEST=${AGENT_MAX_PER_REQUEST:-3}
      - REACT_MAX_STEPS=${REACT_MAX_STEPS:-4}
      - REACT_RUN_DB_PATH=/app/data/react-runs/react-runs.db
      - AGENT_BUNDLE_DB_PATH=/app/data/evolution/agent-bundles.db
      - REACT_APPROVAL_TTL_SECONDS=${REACT_APPROVAL_TTL_SECONDS:-900}
      - REACT_RECOVERY_GRACE_SECONDS=${REACT_RECOVERY_GRACE_SECONDS:-30}
      - TOOL_APPROVAL_MODE=${TOOL_APPROVAL_MODE:-default}
      - TOOL_OUTPUT_MAX_CHARS=${TOOL_OUTPUT_MAX_CHARS:-4000}
      - MODEL_PROVIDER=${MODEL_PROVIDER:-deepseek}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-https://api.deepseek.com/anthropic}
      - VLM_ENABLED=${VLM_ENABLED:-false}
      - MODEL_VISION=${MODEL_VISION:-deepseek-v4-flash-vision-exp}
      - VLM_BASE_URL=${VLM_BASE_URL:-https://api.deepseek.com/anthropic}
      - VLM_MAX_TOKENS=${VLM_MAX_TOKENS:-512}
      - MODEL_INTENT=${MODEL_INTENT:-deepseek-v4-flash}
      - MODEL_INTENT_REASONING=${MODEL_INTENT_REASONING:-none}
      - MODEL_INTENT_MIN_COMPLETION_TOKENS=${MODEL_INTENT_MIN_COMPLETION_TOKENS:-0}
      - MODEL_WORKER=${MODEL_WORKER:-deepseek-v4-flash}
      - MODEL_WORKER_REASONING=${MODEL_WORKER_REASONING:-none}
      - MODEL_WORKER_MIN_COMPLETION_TOKENS=${MODEL_WORKER_MIN_COMPLETION_TOKENS:-0}
      - MODEL_REACT=${MODEL_REACT:-deepseek-v4-flash}
      - MODEL_REACT_REASONING=${MODEL_REACT_REASONING:-none}
      - MODEL_REACT_MIN_COMPLETION_TOKENS=${MODEL_REACT_MIN_COMPLETION_TOKENS:-0}
      - MODEL_MEMORY=${MODEL_MEMORY:-deepseek-v4-flash}
      - MODEL_MEMORY_REASONING=${MODEL_MEMORY_REASONING:-none}
      - MODEL_MEMORY_MIN_COMPLETION_TOKENS=${MODEL_MEMORY_MIN_COMPLETION_TOKENS:-0}
      - MODEL_REWRITE=${MODEL_REWRITE:-deepseek-v4-flash}
      - MODEL_REWRITE_REASONING=${MODEL_REWRITE_REASONING:-none}
      - MODEL_REWRITE_MIN_COMPLETION_TOKENS=${MODEL_REWRITE_MIN_COMPLETION_TOKENS:-0}
      - MODEL_RERANK=${MODEL_RERANK:-deepseek-v4-flash}
      - MODEL_RERANK_REASONING=${MODEL_RERANK_REASONING:-none}
      - MODEL_RERANK_MIN_COMPLETION_TOKENS=${MODEL_RERANK_MIN_COMPLETION_TOKENS:-0}
      - MODEL_SYNTHESIS=${MODEL_SYNTHESIS:-deepseek-v4-pro}
      - MODEL_SYNTHESIS_REASONING=${MODEL_SYNTHESIS_REASONING:-none}
      - MODEL_SYNTHESIS_MIN_COMPLETION_TOKENS=${MODEL_SYNTHESIS_MIN_COMPLETION_TOKENS:-0}
      - MODEL_VERIFIER=${MODEL_VERIFIER:-deepseek-v4-pro}
      - MODEL_VERIFIER_REASONING=${MODEL_VERIFIER_REASONING:-none}
      - MODEL_VERIFIER_MIN_COMPLETION_TOKENS=${MODEL_VERIFIER_MIN_COMPLETION_TOKENS:-0}
      - MODEL_JUDGE=${MODEL_JUDGE:-deepseek-v4-pro}
      - MODEL_JUDGE_REASONING=${MODEL_JUDGE_REASONING:-none}
      - MODEL_JUDGE_MIN_COMPLETION_TOKENS=${MODEL_JUDGE_MIN_COMPLETION_TOKENS:-0}
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET}
      - AUTH_JWT_ISSUER=${AUTH_JWT_ISSUER:-dialogpilot}
      - AUTH_JWT_AUDIENCE=${AUTH_JWT_AUDIENCE:-dialogpilot-api}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
    volumes:
      - ./data/eval:/app/data/eval:ro
      - dialogpilot-tickets:/app/data/tickets
      - dialogpilot-badcases:/app/data/badcases
      - dialogpilot-customer-operations:/app/data/customer-operations
      - dialogpilot-react-runs:/app/data/react-runs
      - dialogpilot-evolution:/app/data/evolution
      - ./skills:/app/skills:ro
      - dialogpilot-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dialogpilot-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ── Nginx 反向代理 ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: dialogpilot-nginx
    ports:
      - "80:80"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      dialogpilot:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dialogpilot-network
    healthcheck:
      # Alpine 的 localhost 优先解析到 ::1，而当前 Nginx 只监听 IPv4。
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# ── 网络 ────────────────────────────────────────────────────────────────────
networks:
  dialogpilot-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ── 数据卷 ──────────────────────────────────────────────────────────────────
volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  nginx-logs:
  dialogpilot-tickets:
  dialogpilot-badcases:
  dialogpilot-customer-operations:
  dialogpilot-react-runs:
  dialogpilot-evolution:
  dialogpilot-logs:
