# Prometheus 配置文件 — DialogPilot 智能客服系统

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'dialogpilot'
    environment: 'production'

rule_files:
  - "alerts/*.yml"

scrape_configs:
  # DialogPilot 主应用指标
  - job_name: 'dialogpilot-app'
    static_configs:
      - targets: ['dialogpilot:8000']
        labels:
          service: 'dialogpilot'
    scrape_interval: 10s
    metrics_path: '/metrics'

  # Prometheus 自监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
