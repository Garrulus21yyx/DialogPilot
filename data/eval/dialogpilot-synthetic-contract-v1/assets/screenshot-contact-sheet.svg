  <g transform="translate(360 300)"><rect class="panel" x="4" y="4" width="352" height="292"/><rect class="bar" x="4" y="4" width="352" height="48"/><text class="title" x="22" y="36">退款详情</text><text class="body" x="24" y="112">状态：审核中</text><text class="muted" x="24" y="150">申请编号：rf-syn-7</text><text class="muted" x="24" y="188">页面未显示到账结果</text></g>
