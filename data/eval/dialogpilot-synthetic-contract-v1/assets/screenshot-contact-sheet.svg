<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="600" viewBox="0 0 1800 600">
  <style>
    .panel { fill:#f7f8fa; stroke:#d6dae1; stroke-width:4 }
    .bar { fill:#27364b }
    .title { font:700 22px sans-serif; fill:#fff }
    .body { font:20px sans-serif; fill:#1d2733 }
    .muted { font:16px sans-serif; fill:#667085 }
    .error { font:700 25px monospace; fill:#c4322b }
    .ok { font:700 22px sans-serif; fill:#18794e }
    .button { fill:#1769aa }
    .buttonText { font:700 17px sans-serif; fill:#fff }
  </style>
  <rect width="1800" height="600" fill="#fff"/>

  <g transform="translate(0 0)"><rect class="panel" x="4" y="4" width="352" height="292"/><rect class="bar" x="4" y="4" width="352" height="48"/><text class="title" x="22" y="36">登录</text><text class="error" x="24" y="112">E-AUTH-17</text><text class="body" x="24" y="152">登录凭据已过期</text><text class="muted" x="24" y="190">请重新登录后再试</text></g>
