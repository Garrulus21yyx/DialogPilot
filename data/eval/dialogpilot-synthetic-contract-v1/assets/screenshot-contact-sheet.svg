  <g transform="translate(720 0)"><rect class="panel" x="4" y="4" width="352" height="292"/><rect class="bar" x="4" y="4" width="352" height="48"/><text class="title" x="22" y="36">API 响应</text><text class="error" x="24" y="112">HTTP 401</text><text class="body" x="24" y="152">invalid_token</text><text class="muted" x="24" y="190">request_id: req-syn-401</text></g>
  <g transform="translate(1080 0)"><rect class="panel" x="4" y="4" width="352" height="292"/><rect class="bar" x="4" y="4" width="352" height="48"/><text class="title" x="22" y="36">API 响应</text><text class="error" x="24" y="112">HTTP 500</text><text class="body" x="24" y="152">internal_error</text><text class="muted" x="24" y="190">request_id: req-syn-500</text></g>
  <g transform="translate(1440 0)"><rect class="panel" x="4" y="4" width="352" height="292"/><rect class="bar" x="4" y="4" width="352" height="48"/><text class="title" x="22" y="36">订阅管理</text><text class="body" x="24" y="112">方案：月度标准版</text><text class="body" x="24" y="150">自动续费：已开启</text><text class="muted" x="24" y="190">下次续费：2026-10-01</text></g>

