name: ci

# 所有分支 push 和 PR 都必须经过同一组 Python 3.12 验收门禁。
on:
  push:
  pull_request:

permissions:
  # 测试只需读取代码，不授予写仓库或操作其他服务的权限。
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 固定项目声明的 Python 版本，并缓存 pip 下载以缩短重复运行时间。
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      # 先做全模块语法编译，再执行全部行为/不变量测试；数量随合同增长。
      - run: python -m compileall -q agents api core evaluation mcp memory monitor services
      - run: python -m pytest -q
