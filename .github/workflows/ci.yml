name: ci

# 所有分支 push 和 PR 都必须经过同一组 Python 3.12 验收门禁。
on:
  push:
  pull_request:

permissions:
  # 测试只需读取代码，不授予写仓库或操作其他服务的权限。
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-bookworm
        env:
          POSTGRES_DB: dialogpilot_test
          POSTGRES_USER: dialogpilot
          POSTGRES_PASSWORD: dialogpilot-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dialogpilot -d dialogpilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://dialogpilot:dialogpilot-ci@localhost:5432/dialogpilot_test
    steps:
      - uses: actions/checkout@v7
      # 固定项目声明的 Python 版本，并缓存 pip 下载以缩短重复运行时间。
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: python scripts/run_postgres_migrations.py --database-url "$TEST_DATABASE_URL"
      # 先做全模块语法编译，再执行全部行为/不变量测试；数量随合同增长。
      - run: python -m compileall -q agents api core evaluation infrastructure mcp memory migrations monitor services
      - run: python -m pytest -q
